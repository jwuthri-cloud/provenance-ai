[project]
name = "trace-capture-claude-code"
version = "0.1.0"
description = "trace — Claude Code capture: hooks (PostToolUse/SessionStart/UserPromptSubmit) + transcript correlation"
requires-python = ">=3.11"
dependencies = [
    "trace-client",
]

[project.scripts]
trace-claude-hook = "trace_capture_claude_code.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_capture_claude_code"]

[tool.uv.sources]
trace-client = { workspace = true }
