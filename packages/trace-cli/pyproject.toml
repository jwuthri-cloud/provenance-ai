[project]
name = "trace-cli"
version = "0.1.0"
description = "trace — the CLI (blame / summary / init / status / doctor)"
requires-python = ">=3.11"
dependencies = [
    "trace-core",
    "trace-daemon",
    "trace-capture-claude-code",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
trace = "trace_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_cli"]

[tool.uv.sources]
trace-core = { workspace = true }
trace-daemon = { workspace = true }
trace-capture-claude-code = { workspace = true }
