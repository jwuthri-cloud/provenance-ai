[project]
name = "trace-core"
version = "0.1.0"
description = "trace — shared core: AuthorshipEvent schema, canonical hashing, hash chain, confidence (the CC0 standard surface)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "blake3>=0.4",
    "rfc8785>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_core"]
